name: Notification Scheduler

on:
  schedule:
    # Runs every 15 minutes
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduler endpoint
        run: |
          response=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://sol-ventures.com/ease-okr/api/notifications/scheduled" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}")
          echo "HTTP status: $response"
          cat /tmp/resp.json
          if [ "$response" -ge 500 ]; then
            echo "Scheduler endpoint returned error $response"
            exit 1
          fi
