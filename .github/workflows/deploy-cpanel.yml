name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
      APP_PORT: ${{ secrets.CPANEL_APP_PORT }}
      RESTART_COMMAND: ${{ secrets.CPANEL_RESTART_COMMAND }}
      NEXT_PUBLIC_BASE_PATH: /ease-okr
      NEXT_PUBLIC_APP_PROFILE: ease-okr
      NEXT_PUBLIC_AZURE_CLIENT_ID: 99756659-eca1-4aa6-a9f4-582a9e8ba653
      NEXT_PUBLIC_AAD_TENANT_ID: ${{ secrets.AZURE_APP_TENANT_ID }}
      NEXT_PUBLIC_AZURE_AUTHORITY: https://login.microsoftonline.com/${{ secrets.AZURE_APP_TENANT_ID }}
      NEXT_PUBLIC_REDIRECT_URI: https://sol-ventures.com/ease-okr
      NEXT_PUBLIC_POST_LOGOUT_REDIRECT_URI: https://sol-ventures.com/ease-okr
      NEXT_PUBLIC_LOGIN_SCOPES: openid profile email User.Read
      NEXT_PUBLIC_SHAREPOINT_SITE_URL: https://easeint1.sharepoint.com/sites/OKRFollowUp
      NEXT_PUBLIC_SHAREPOINT_STORAGE_LIST: EASE OKR Store
      NEXT_PUBLIC_COMPANION_APP_URL: https://sol-ventures.com/okr
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npx tsc --noEmit --incremental false

      - name: Validate public auth env
        run: |
          test -n "$NEXT_PUBLIC_AZURE_CLIENT_ID" || (echo "Missing NEXT_PUBLIC_AZURE_CLIENT_ID" && exit 1)
          test -n "$NEXT_PUBLIC_AAD_TENANT_ID" || (echo "Missing NEXT_PUBLIC_AAD_TENANT_ID" && exit 1)
          test "$NEXT_PUBLIC_AAD_TENANT_ID" != "undefined" || (echo "NEXT_PUBLIC_AAD_TENANT_ID resolved to undefined" && exit 1)
          echo "Public auth env is configured."

      - name: Build application
        run: npm run build

      - name: Write server-side secrets to .env.deploy
        env:
          SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          SECRET_AZURE_APP_CLIENT_SECRET: ${{ secrets.AZURE_APP_CLIENT_SECRET }}
          SECRET_NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
        run: |
          : > .env.deploy
          # next.config.mjs is re-evaluated when Passenger boots the app, so the
          # base path is needed at RUNTIME as well as at build time. Without it
          # Next runs with basePath "" and emits the <head> asset URLs (CSS,
          # webpack-*, main-app-*, polyfills-*) with no prefix, which 404.
          printf 'NEXT_PUBLIC_BASE_PATH=%s\n' "$NEXT_PUBLIC_BASE_PATH" >> .env.deploy
          if [ -n "$SECRET_OPENAI_API_KEY" ]; then
            printf 'OPENAI_API_KEY=%s\n' "$SECRET_OPENAI_API_KEY" >> .env.deploy
          fi
          if [ -n "$SECRET_SCHEDULER_SECRET" ]; then
            printf 'SCHEDULER_SECRET=%s\n' "$SECRET_SCHEDULER_SECRET" >> .env.deploy
          fi
          if [ -n "$SECRET_AZURE_APP_CLIENT_SECRET" ]; then
            printf 'AZURE_APP_CLIENT_SECRET=%s\n' "$SECRET_AZURE_APP_CLIENT_SECRET" >> .env.deploy
          fi
          if [ -n "$SECRET_NOTIFICATION_FROM_EMAIL" ]; then
            printf 'NOTIFICATION_FROM_EMAIL=%s\n' "$SECRET_NOTIFICATION_FROM_EMAIL" >> .env.deploy
          fi

      - name: Create deployment archive
        run: |
          tar -czf deploy.tgz \
            .next \
            app \
            lib \
            public \
            app.js \
            next.config.mjs \
            package.json \
            package-lock.json \
            .env.deploy

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          source: deploy.tgz
          target: /tmp/okr-follow-up-deploy

      - name: Extract, install production deps, and restart on cPanel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          script_stop: true
          envs: APP_DIR,APP_PORT,RESTART_COMMAND
          script: |
            set -e

            if [ -z "$APP_DIR" ]; then
              echo "CPANEL_APP_DIR secret is required."
              exit 1
            fi

            mkdir -p "$APP_DIR"
            mkdir -p /tmp/okr-follow-up-deploy/extracted

            tar -xzf /tmp/okr-follow-up-deploy/deploy.tgz -C /tmp/okr-follow-up-deploy/extracted

            # Decide whether dependencies actually changed, BEFORE the old
            # package-lock.json is deleted. npm forks many processes and this
            # account sits near its CloudLinux NPROC cap, so an unnecessary
            # `npm ci` is what makes deploys fail with
            # "pthread_create: Resource temporarily unavailable" (status 134).
            OLD_LOCK_HASH=""
            if [ -f "$APP_DIR/package-lock.json" ]; then
              OLD_LOCK_HASH="$(sha256sum "$APP_DIR/package-lock.json" | cut -d' ' -f1)"
            fi
            NEW_LOCK_HASH="$(sha256sum /tmp/okr-follow-up-deploy/extracted/package-lock.json | cut -d' ' -f1)"

            NEED_INSTALL=1
            if [ -n "$OLD_LOCK_HASH" ] && [ "$OLD_LOCK_HASH" = "$NEW_LOCK_HASH" ] && [ -e "$APP_DIR/node_modules/next/package.json" ]; then
              NEED_INSTALL=0
            fi
            echo "Dependency install needed: $NEED_INSTALL"

            find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name ".env" ! -name ".htaccess" ! -name "tmp" ! -name "logs" ! -name "node_modules" -exec rm -rf {} +

            cp -R /tmp/okr-follow-up-deploy/extracted/. "$APP_DIR"
            cd "$APP_DIR"

            # Merge bundled .env.deploy into persistent .env
            if [ -f .env.deploy ]; then
              touch .env
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in ""|"#"*) continue;; esac
                key="${line%%=*}"
                if [ -z "$key" ]; then continue; fi
                if grep -q "^${key}=" .env 2>/dev/null; then
                  grep -v "^${key}=" .env > .env.tmp && mv .env.tmp .env
                fi
                echo "$line" >> .env
              done < .env.deploy
              rm -f .env.deploy
            fi

            if [ -n "$APP_PORT" ]; then
              export APP_PORT="$APP_PORT"
            fi

            APP_NAME="$(basename "$APP_DIR")"
            NODE_BIN_DIR=""
            for candidate in "$HOME/nodevenv/$APP_NAME" "$HOME/nodevenv/public_html/$APP_NAME"; do
              if [ -d "$candidate" ]; then
                FOUND_BIN_DIR="$(find "$candidate" -maxdepth 3 -type d -path '*/bin' | head -n 1)"
                if [ -n "$FOUND_BIN_DIR" ]; then
                  NODE_BIN_DIR="$FOUND_BIN_DIR"
                  break
                fi
              fi
            done

            if [ -n "$NODE_BIN_DIR" ]; then
              export PATH="$NODE_BIN_DIR:$PATH"
            fi

            export NODE_ENV=production

            if [ "$NEED_INSTALL" = "0" ]; then
              echo "package-lock.json unchanged and node_modules present - skipping npm install."
              echo "(Deliberate: npm is not invoked at all, so the deploy needs no NPROC headroom.)"
            else
              if ! command -v npm >/dev/null 2>&1; then
                echo "npm is not available in this SSH session."
                echo "Expected a cPanel nodevenv bin directory under $HOME/nodevenv/$APP_NAME or a host-level Node install."
                echo "Current PATH: $PATH"
                if [ -d "$HOME/nodevenv" ]; then
                  echo "Available nodevenv directories:"
                  find "$HOME/nodevenv" -maxdepth 3 -type d | sed 's#^#- #'
                else
                  echo "$HOME/nodevenv does not exist."
                fi
                exit 127
              fi

              echo "Using npm: $(command -v npm)"
              npm --version
              node --version

              echo "Installing production dependencies"
              npm ci --omit=dev --no-audit --no-fund
            fi

            # Restart. `tmp/restart.txt` is what Passenger watches. Nothing here
            # forks a subshell and passenger-config is never called: both are
            # fork-heavy, and a failed fork on this account is silent.
            # Every command below is a shell BUILTIN wherever possible:
            # `touch` and `mkdir` are external binaries, so each one forks, and
            # on this NPROC-capped account a failed fork kills the whole SSH
            # shell instantly - no error, no exit code, nothing after the last
            # echo. `: > file` is a redirection, which costs no process at all.
            set +e
            echo "Restarting application (shell pid $$, cwd $PWD)"

            if [ -n "$RESTART_COMMAND" ]; then
              echo "Running custom restart command"
              sh -lc "$RESTART_COMMAND"
              echo "Custom restart exit code: $?"
            else
              echo "No RESTART_COMMAND set - signalling Passenger via tmp/restart.txt"

              if [ -e tmp ] && [ ! -d tmp ]; then
                echo "WARNING: '$PWD/tmp' exists but is not a directory. Removing it."
                rm -f tmp
                echo "rm exit code: $?"
              fi

              if [ ! -d tmp ]; then
                echo "tmp/ missing - creating it (this forks)"
                mkdir tmp
                echo "mkdir exit code: $?"
              else
                echo "tmp/ already exists - no fork needed"
              fi

              : > tmp/restart.txt
              WRITE_RC=$?
              echo "write tmp/restart.txt exit code: $WRITE_RC"

              if [ "$WRITE_RC" != "0" ] || [ ! -f tmp/restart.txt ]; then
                echo "WARNING: could not signal a restart. The new build is on disk"
                echo "but Passenger may still be serving the old process."
                echo "Free processes on the account (NPROC) and redeploy, or restart"
                echo "the app from cPanel -> Setup Node.js App."
                set -e
                exit 1
              fi

              echo "Restart signalled."
            fi
            set -e

            echo "Cleaning temp deployment files"
            rm -rf /tmp/okr-follow-up-deploy

            echo "Deployment complete"
